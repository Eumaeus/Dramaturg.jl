<!DOCTYPE html>
<html lang="grc">
<head>
    <meta charset="UTF-8">
    <title>Greek Reader — {{title}} ({{passage_span}})</title>
    <link rel="stylesheet" href="../css/style.css"> <!-- your CSS will live here -->
</head>
<body>
    <nav>{{navigation}}</nav>
    <div id="title">
        <div id="work_title">
            {{title}}
        </div>
        <div id="bibliography">
            <!-- config.toml: ["ouput"]["md_bibliography"] --> 
        </div>
    </div>
    <div id="text">
        {{greek_text}} 
    </div>
    <div id="textdata">
        <div id="morphdata">
            <!-- morphological-lexical data keyed to tokens goes here -->
        </div>
        <div id="commentary"> 
            <!-- reserved for future use -->
        </div>
    </div>
    <script src="../js/interactive.js"></script>
</body>
</html>
