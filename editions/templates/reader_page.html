<!DOCTYPE html>
<html lang="grc">
<head>
    <meta charset="UTF-8">
    <title>Greek Reader — {{page_title}} ({{passage_span}})</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Optional web fonts – fail gracefully -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&amp;display=swap" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400..800&amp;display=swap" rel="stylesheet"  media="print" onload="this.media='all'">

</head>
<body>
    <div id="masthead" class="sansfont">Furman Classics. <a href="https://github.com/Eumaeus/Dramaturg.jl">Dramaturg Editions</a>. C. Blackwell, 2026. CC-BY-NC. Code and instructions on <a href="https://github.com/Eumaeus/Dramaturg.jl">Github</a>.</div>

    <nav>{{navigation}}</nav>


    <div id="title">
        <div id="work_title">{{title}}</div>
        <div id="bibliography"></div>
    </div>

    <div class="main-content">
        <div id="text">
            {{greek_text}}
            
            <nav>{{navigation}}</nav>

        </div>

        <div id="sidebar">
            <h3 id="sidebar-title">Morphology &amp; Lexicon <br/><span class="peek-note sansfont">( hover to peek ✧ click to lock )</span></h3>
            
          <!-- Editor Mode toggle (always visible) -->
            <div id="editor-mode-toggle-wrapper" style="margin-bottom: 1.2rem; font-size: 0.95rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="editor-mode-toggle">
                    <span class="sansfont">Editor Mode <small style="color:#28a745; font-weight:normal;">(Mark preferred parsings)</small></span>
                </label>
            </div> 

            <!-- Editor Mode controls -->
            <div id="editor-controls" class="editor-controls sansfont" style="display: none; margin-bottom: 1.5rem; padding: 0.5rem 1rem 1rem 0.5rem; background: #f0f8f0; border: 1px solid #28a745; border-radius: 8px;">
                <!-- <strong style="color:#28a745;">Editor Mode</strong><br>
                <small style="color:#555;">Select preferred parsing for each token.<br>Download when finished reading the page.</small> -->
                <div style="margin-top: 0.8rem;">
                    <button id="download-editor-tsv" style="padding: 0.4rem 1rem; margin: 0.4rem; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer;">📥 Download Editor’s Index (.tsv)</button>
                    <button id="clear-editor-choices" style="padding: 0.4rem 1rem; background: #ccc; border: none; border-radius: 6px; cursor: pointer; margin-left: 0.5rem;">Clear All</button>
                </div>
            </div>


            <div id="infopanel" class="infopanel"></div>

        </div>



    <div id="textdata" style="display:none">
        <div id="morphdata">
            {{morph_data}}
        </div>
        <div id="commentary"></div>
    </div>



    <script src="../js/interactive.js"></script>
</body>
</html>
