# Configuration for Dramaturg — CEX loading, tokenization, and elision indexing

[input]
cex_path = "source-data/texts/Philosophy/aristotle-poetics.cex"
text_urn = "urn:cts:greekLit:tlg0086.tlg034.bekker_fu:" 
file_name = "Aristotle_Poetics"
text_title = "Aristotle, *Poetics*"
text_genre = "prose" # options are "poetry", "prose", "drama"
citation_level = 2 # "book.section". A poem might be 1, 'poetic-line'
filter_paratext = "" # filter out passages with this string in the URN.


[output]
html_tokens_per_page = 250
html_output_dir = "editions/html/Philosophy/Aristotle_Poetics/pages"
html_template_dir = "editions/templates"
html_index_template = "index.html"
html_page_template = "reader_page.html"
html_temp_dir = "data/html_temp/Philosophy/Aristotle_Poetics"
md_bibliography = "editions/frontmatter/Philosophy/Aristotle_Poetics/bibliography.md"
md_frontmatter = "editions/frontmatter/Philosophy/Aristotle_Poetics/frontmatter.md"
lsj_url = "http://localhost:8080"
editions_dir = "editions/html/"


[lexicon]
lsj_cex =   "source-data/dictionaries/lsj_chicago.cex"
lsj_index = "source-data/dictionaries/lsj_index_beta.tsv"
lsj_short = "source-data/dictionaries/lsj_short_defs.tsv"

[morphology]
raw_morph_data = "morph/output/aristotle-poetics-analysis.txt"
morph_pos_triplets = "data/indexes/Philosophy/Aristotle_Poetics/Aristotle_Poetics_morpheus_triplets.tsv"
morph_pos_errors = "morph/output/Aristotle_Poetics_parse_errors.log"
morph_lemmata_alignment = "data/indexes/Philosophy/Aristotle_Poetics/Aristotle_Poetics_triplets_lemmata.tsv"
morph_lemmata_alignment_errors = "data/indexes/Philosophy/Aristotle_Poetics/Aristotle_Poetics_triplets_lemmata_errors.tsv"
morph_token_index = "data/indexes/Philosophy/Aristotle_Poetics/Aristotle_Poetics_morphology_index.tsv"
morph_token_index_errors = "data/indexes/Philosophy/Aristotle_Poetics/Aristotle_Poetics_morphology_index_errors.tsv"
local_morph_dict = "data/morphology/aristotle-poetics_morph.cex"



# NEW sections for this milestone
[processing]
data_root = "data"                       # base folder for all generated files
tokenized_dir = "tokenized/Philosophy/Aristotle_Poetics"
indexes_dir = "indexes/Philosophy/Aristotle_Poetics"
vocabulary_dir = "vocabulary/Philosophy/Aristotle_Poetics"
tokenized_suffix = "_tokenized.cex"
elided_index_suffix = "_elided.tsv"
elided_histogram_suffix = "_elided_histogram.tsv"
word_histogram_suffix = "_word_histogram.tsv"
vocabulary_unicode_suffix = "_uc_vocabulary.txt"
