# Configuration for Dramaturg — CEX loading, tokenization, and elision indexing

[input]
cex_path = "source-data/texts/NT/nt-mark.cex"
text_urn = "urn:cts:greekLit:tlg0031.tlg002.wh:" 
file_name = "Mark"
text_title = "The New Testament, *The Gospel According to Mark*"
text_genre = "prose" # options are "poetry", "prose", "drama"
citation_level = 2 # "book.section". A poem might be 1, 'poetic-line'
filter_paratext = "" # filter out passages with this string in the URN.


[output]
html_tokens_per_page = 250
html_output_dir = "editions/html/NT/Mark/pages"
html_template_dir = "editions/templates"
html_index_template = "index.html"
html_page_template = "reader_page.html"
html_temp_dir = "data/html_temp/NT/Mark"
md_bibliography = "editions/frontmatter/NT/Mark/bibliography.md"
md_frontmatter = "editions/frontmatter/NT/Mark/frontmatter.md"
lsj_url = "https://folio3.furman.edu/lsj/"
editions_dir = "editions/html/"


[lexicon]
lsj_cex =   "source-data/dictionaries/lsj_chicago.cex"
lsj_index = "source-data/dictionaries/lsj_index_beta.tsv"
lsj_short = "source-data/dictionaries/lsj_short_defs.tsv"

[morphology]
raw_morph_data = "morph/output/nt-mark-analysis.txt"
morph_pos_triplets = "data/indexes/NT/Mark/Mark_morpheus_triplets.tsv"
morph_pos_errors = "morph/output/nt-mark_parse_errors.log"
morph_lemmata_alignment = "data/indexes/NT/Mark/Mark_triplets_lemmata.tsv"
morph_lemmata_alignment_errors = "data/indexes/NT/Mark/Mark_triplets_lemmata_errors.tsv"
morph_token_index = "data/indexes/NT/Mark/Mark_morphology_index.tsv"
morph_token_index_errors = "data/indexes/NT/Mark/Mark_morphology_index_errors.tsv"
local_morph_dict = "data/morphology/NT/mark_morph.cex"



# NEW sections for this milestone
[processing]
data_root = "data"                       # base folder for all generated files
tokenized_dir = "tokenized/NT/Mark"
indexes_dir = "indexes/NT/Mark"
vocabulary_dir = "vocabulary/NT/Mark"
tokenized_suffix = "_tokenized.cex"
elided_index_suffix = "_elided.tsv"
elided_histogram_suffix = "_elided_histogram.tsv"
word_histogram_suffix = "_word_histogram.tsv"
vocabulary_unicode_suffix = "_uc_vocabulary.txt"
vocabulary_beta_suffix = "_beta_vocabulary.txt"


[editorial]
elision_dict      = "source-data/dictionaries/editorial_dict_elision.tsv"

enclitics_dict    = "source-data/dictionaries/editorial-dict-enclitics.tsv"

anastrophe_dict   = "source-data/dictionaries/editorial_dict_anastrophe.tsv"

lsj_index 			= "source-data/dictionaries/lsj_index.tsv"

lsj_index_beta		= "source-data/dictionaries/lsj_index_beta.tsv"

master_morph_dict = "data/morphology/Greek_Morphology.cex"

user_morphology_dir = "source-data/morphology/user-generated"

editor_index_files = "source-data/edited_morphology/NT/Mark/"

editor_index_error = "data/morphology/editorial_index_error_nt-mark.txt"

editor_index_morphology = "data/morphology/editorial_index_morphology_nt-mark.cex"