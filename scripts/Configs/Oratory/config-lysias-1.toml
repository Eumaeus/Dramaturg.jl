# Configuration for Dramaturg — CEX loading, tokenization, and elision indexing

[input]
cex_path = "source-data/texts/Oratory/lysias-1.cex"
text_urn = "urn:cts:greekLit:tlg0540.tlg001.fucex:" 
file_name = "Lysias_1"
text_title = "Lysias 1"
text_genre = "prose" # options are "poetry", "prose", "drama"
citation_level = 1 # "section".
filter_paratext = "" # filter out passages with this string in the URN.


[output]
html_tokens_per_page = 250
html_output_dir = "editions/html/Oratory/Lysias_1/pages"
html_template_dir = "editions/templates"
html_index_template = "index.html"
html_page_template = "reader_page.html"
html_temp_dir = "data/html_temp/Oratory/Lysias_1"
md_bibliography = "editions/frontmatter/Oratory/Lysias_1/bibliography.md"
md_frontmatter = "editions/frontmatter/Oratory/Lysias_1/frontmatter.md"
lsj_url = "https://folio3.furman.edu/lsj/"
editions_dir = "editions/html/"


[lexicon]
lsj_cex =   "source-data/dictionaries/lsj_chicago.cex"
lsj_index = "source-data/dictionaries/lsj_index_beta.tsv"
lsj_short = "source-data/dictionaries/lsj_short_defs.tsv"

[morphology]
raw_morph_data = "morph/output/lysias-1-analysis.txt"
morph_pos_triplets = "data/indexes/Oratory/Lysias_1/Lysias_1_morpheus_triplets.tsv"
morph_pos_errors = "morph/output/lysias_1_parse_errors.log"
morph_lemmata_alignment = "data/indexes/Oratory/Lysias_1/Lysias_1_triplets_lemmata.tsv"
morph_lemmata_alignment_errors = "data/indexes/Oratory/Lysias_1/Lysias_1_triplets_lemmata_errors.tsv"
morph_token_index = "data/indexes/Oratory/Lysias_1/Lysias_1_morphology_index.tsv"
morph_token_index_errors = "data/indexes/Oratory/Lysias_1/Lysias_1_morphology_index_errors.tsv"
local_morph_dict = "data/morphology/Oratory/lysias-1_morph.cex"



# NEW sections for this milestone
[processing]
data_root = "data"                       # base folder for all generated files
tokenized_dir = "tokenized/Oratory/Lysias_1"
indexes_dir = "indexes/Oratory/Lysias_1"
vocabulary_dir = "vocabulary/Oratory/Lysias_1"
tokenized_suffix = "_tokenized.cex"
elided_index_suffix = "_elided.tsv"
elided_histogram_suffix = "_elided_histogram.tsv"
word_histogram_suffix = "_word_histogram.tsv"
